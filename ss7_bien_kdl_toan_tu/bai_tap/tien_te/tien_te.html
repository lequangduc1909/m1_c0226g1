<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money</title>
    <script src="tien_te.js" defer></script>
  </head>
  <body>
    <form>
      
        <label for="moneyin"><b>Amount</b></label>
        <input
          type="number"
          id="moneyin"
          name="moneyin"
          placeholder="Type the value of Money"
          min="0"
        />
      
        <label for="currency_unit1"><b>From Currency</b></label>
        <select name="currency_unit1" id="currency_unit1">
          <option value="VND" selected>VND</option>
          <option value="USD">USD</option>
        </select>
           
        <label for="currency_unit2"><b>To Currency</b></label>
        <select name="currency_unit2" id="currency_unit2">
          <option value="VND">VND</option>
          <option value="USD" selected>USD</option>
        </select> <br> <br>
      
        <button type="button" id="convert_button">Convert</button>
      
    </form>

    <h3 id="result"></h3>
  </body>
</html>
