<!-- Đề 2: Máy tính bỏ túi đơn giản (Trung bình)
Yêu cầu: Viết chương trình nhập vào hai số thực a, b 
và một ký tự phép tính op (+, -, *, /). 
Sử dụng switch-case để thực hiện tính toán:
Nếu là +: In ra tổng a + b.
Nếu là -: In ra hiệu a - b.
Nếu là *: In ra tích a* b
Nếu là /: Kiểm tra nếu b khác 0 thì in ra thương, 
ngược lại báo lỗi không thể chia cho 0.
Các ký tự khác: Báo phép tính không hỗ trợ. -->
