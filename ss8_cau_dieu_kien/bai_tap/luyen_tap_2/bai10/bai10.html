  <body>
    <h2>Tính tiền điện</h2>

    Nhập số điện tiêu thụ (kWh):
    <input type="text" id="electric" /><br /><br />

    <button id="check">Kiểm tra</button>
    <button id="reset">Hoàn tác</button>

    <br /><br />

    <span id="display"></span>

    <i><b>Khung giá giả định:</b></i> <br />
    <i>≤ 50 kWh 1800 đ</i> <br />
    <i>≤ 100 kWh 2000 đ</i><br />
    <i>≤ 200 kWh 2500 đ</i><br />
    <i>> 200 kWh 3000 đ</i><br />
