  <body>
    <h2>Tính thuế thu nhập cá nhân</h2>

    Nhập thu nhập (VNĐ):
    <input type="text" id="income" /><br /><br />

    <button id="check">Kiểm tra</button>
    <button id="reset">Hoàn tác</button>

    <br /><br />

    <span id="display"></span> <br />
    <i>Ví dụ trong bài:</i><br />
    <i>≤ 5 triệu thuế 5%</i><br />
    <i>≤ 10 triệu thuế 10%</i><br />
    <i>≤ 18 triệu thuế 15%</i><br />
    <i>> 18 triệu thuế 20%</i><br />
  </body>
